apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibeyeah-nas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vibeyeah-nas
  template:
    metadata:
      labels:
        app: vibeyeah-nas
    spec:
      containers:
      - name: busybox
        image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/busybox:1.36
        command: ["sleep","36000"]
        volumeMounts:
        - name: vibeyeah-nas-pvc
          mountPath: /data
      volumes:
      - name: vibeyeah-nas-pvc
        persistentVolumeClaim:
          claimName: vibeyeah-nas-pvc
